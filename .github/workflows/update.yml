name: Обновление каталога

# Запускается только вручную: Actions → «Обновление каталога» → Run workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'update — забрать новые посты из Telegram и переименовать; rename — только переименовать товары с простыми названиями'
        type: choice
        options: [update, rename]
        default: update

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Собрать новые товары из Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/catalog.py ${{ inputs.mode == 'rename' && '--rename-only' || '' }}
      - name: Сохранить изменения
        run: |
          git config user.name "brandora-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A site names.json
          git diff --cached --quiet || git commit -q -m "Каталог: обновление $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
